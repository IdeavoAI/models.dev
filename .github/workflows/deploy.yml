name: Deploy

on:
  push:
    branches:
      - dev
  workflow_dispatch:
  workflow_run:
    workflows: ["Sync upstream"]
    types: [completed]
    branches: [dev]

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  deploy:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    env:
      API_PROVIDERS: ${{ vars.API_PROVIDERS || 'amazon-bedrock,anthropic,alibaba-coding-plan,chutes,google,kimi-for-coding,minimax-coding-plan,mistral,nvidia,ollama-cloud,openai,opencode,opencode-go,openrouter,togetherai,tokenrouter,zai-coding-plan,ideavo' }}
      CLOUDFLARE_PAGES_PROJECT_NAME: ${{ vars.CLOUDFLARE_PAGES_PROJECT_NAME || 'models-dev' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build static site
        run: bun run --cwd packages/web build

      - name: Deploy to Cloudflare Pages
        run: bunx wrangler pages deploy packages/web/dist --project-name "$CLOUDFLARE_PAGES_PROJECT_NAME" --branch "$GITHUB_REF_NAME"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
