name: Sync upstream

on:
  schedule:
    - cron: "0 */4 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.email "action@github.com"
          git config user.name "GitHub Action"
          git remote add upstream https://github.com/anomalyco/models.dev.git

      - name: Fetch upstream
        run: git fetch upstream

      - name: Rebase onto upstream/dev
        id: rebase
        run: |
          if git rebase upstream/dev; then
            echo "status=success" >> $GITHUB_OUTPUT
          else
            git rebase --abort
            echo "status=conflict" >> $GITHUB_OUTPUT
          fi

      - name: Push
        if: steps.rebase.outputs.status == 'success'
        run: git push --force

      - name: Fail on conflict
        if: steps.rebase.outputs.status == 'conflict'
        run: |
          echo "Rebase against upstream/dev failed. Manual intervention needed."
          exit 1
