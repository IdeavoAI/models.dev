schema = 2
base_model = "zhipuai/glm-5.3-flash"
name = "GLM 5.3 Flash"
description = "GLM model for efficient coding and long-horizon agent tasks"

[modalities]
input = ["text"]
output = ["text"]

[capabilities]
tools = { supported = true, choice = ["auto"] }
reasoning = { supported = true, effort = ["low", "high", "max"] }
cache = { implicit = true }
structured_output = true
system_updates = true

[limit]
context = 200_000
output = 32_000

[cost.text.input]
price = 0.15
cache = { read = 0.03 }

[cost.text.output]
price = 0.5
